<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starbucks AI Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:linear-gradient(135deg,#006241,#1E3932,#00754A);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}

.container{

    width:900px;
    height:92vh;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35);

    display:flex;
    flex-direction:column;

}

.header{

    background:#006241;
    color:white;
    padding:20px;

    display:flex;
    align-items:center;
    gap:15px;

}

.logo{

    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:#006241;
    font-size:30px;
    display:flex;
    justify-content:center;
    align-items:center;

}

.header h2{

    font-size:24px;

}

.header p{

    font-size:14px;
    opacity:.8;

}

.chat{

    flex:1;
    overflow-y:auto;
    padding:25px;
    background:#f8faf8;

}

.message{

    display:flex;
    margin-bottom:20px;
    animation:fade .3s ease;

}

.user{

    justify-content:flex-end;

}

.bot{

    justify-content:flex-start;

}

.bubble{

    max-width:70%;
    padding:14px 18px;
    border-radius:20px;
    font-size:15px;
    line-height:1.6;

}

.user .bubble{

    background:#006241;
    color:white;
    border-bottom-right-radius:5px;

}

.bot .bubble{

    background:white;
    border:1px solid #ddd;
    color:#222;
    border-bottom-left-radius:5px;

}

.footer{

    padding:18px;
    background:white;
    border-top:1px solid #ddd;

    display:flex;
    gap:15px;

}

.footer input{

    flex:1;
    padding:15px;
    border-radius:30px;
    border:2px solid #ddd;
    outline:none;
    font-size:16px;

}

.footer input:focus{

    border-color:#006241;

}

.footer button{

    width:130px;
    border:none;
    border-radius:30px;
    background:#006241;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;

}

.footer button:hover{

    background:#008c5a;
    transform:scale(1.05);

}

.typing{

    display:none;
    color:#777;
    padding-left:20px;
    padding-bottom:10px;
    font-size:14px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:#bbb;
border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
☕
</div>

<div>

<h2>Starbucks AI Chatbot</h2>

<p>Ask anything about Starbucks beverages</p>

</div>

</div>

<div class="chat" id="chat">

<div class="message bot">

<div class="bubble">

👋 Hello! Welcome to Starbucks.

Ask me about:

<br><br>

• Beverage details

<br>

• Calories

<br>

• Caffeine

<br>

• Vegan drinks

<br>

• Prices

<br>

• Ratings

</div>

</div>

</div>

<div class="typing" id="typing">

Bot is typing...

</div>

<div class="footer">

<input

id="message"

placeholder="Ask about Starbucks beverages..."

autocomplete="off"

>

<button onclick="sendMessage()">

Send

</button>

</div>

</div>

<script>

const chat=document.getElementById("chat");

async function sendMessage(){

let input=document.getElementById("message");

let message=input.value.trim();

if(message==="")
return;

chat.innerHTML+=`

<div class="message user">

<div class="bubble">

${message}

</div>

</div>

`;

input.value="";

chat.scrollTop=chat.scrollHeight;

document.getElementById("typing").style.display="block";

let response=await fetch("/chat",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:message

})

});

let data=await response.json();

document.getElementById("typing").style.display="none";

chat.innerHTML+=`

<div class="message bot">

<div class="bubble">

${data.response.replace(/\n/g,"<br>")}

</div>

</div>

`;

chat.scrollTop=chat.scrollHeight;

}

document.getElementById("message").addEventListener("keypress",function(e){

if(e.key==="Enter")

sendMessage();

});

</script>

</body>
</html>
